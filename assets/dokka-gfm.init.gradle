// Applies Dokka 2 with the GFM (Markdown) format to the project in one directory, leaving its build files untouched.
// Usage: ./gradlew --init-script dokka-gfm.init.gradle -PdokkaProjectDir=<absolute dir> dokkaGenerateMarkdown
def dokkaVersion = '2.2.0'
def dokkaProjectDir = gradle.startParameter.projectProperties['dokkaProjectDir']
// included builds (e.g. React Native's Gradle plugin) run this script too, without the property
if (dokkaProjectDir == null) return
def targetDir = new File(dokkaProjectDir).canonicalFile
def matched = false

// Dokka must share a classloader with AGP and KGP to find the Android sources, so it goes on the root buildscript
// classpath; from the init script's own classpath it can't see them ("Dokka could not load KotlinBasePlugin").
rootProject {
  buildscript.dependencies.add('classpath', "org.jetbrains.dokka:dokka-gradle-plugin:$dokkaVersion")
}

// Dokka 2 ships no Markdown format. This is the DokkaMarkdownPlugin from the plugin-gfm README, compiled at runtime
// against the root buildscript classloader for the same reason (a class declared here would load Dokka a second time).
def markdownPluginSource = '''
import org.jetbrains.dokka.gradle.formats.DokkaFormatPlugin
abstract class DokkaMarkdownPlugin extends DokkaFormatPlugin {
  DokkaMarkdownPlugin() { super('markdown') }
  void configure(DokkaFormatPlugin.DokkaFormatPluginContext ctx) {
    def deps = ctx.project.dependencies
    ctx.dokkaPlugin(deps, ctx.dokka(deps, 'gfm-plugin'))
    ctx.formatDependencies.dokkaPublicationPluginClasspathApiOnly.dependencies.addLater(
      ctx.dokka(deps, 'gfm-template-processing-plugin'))
  }
}
'''

gradle.beforeProject { p ->
  if (p.projectDir.canonicalFile != targetDir) return
  matched = true
  // applied after evaluation so a Dokka the project applies itself shows here instead of merging with ours
  p.afterEvaluate {
    if (p.pluginManager.hasPlugin('org.jetbrains.dokka')) {
      throw new GradleException("$targetDir already applies Dokka (org.jetbrains.dokka); generate the Kotlin docs with it instead")
    }
    def loader = p.rootProject.buildscript.classLoader
    p.pluginManager.apply(loader.loadClass('org.jetbrains.dokka.gradle.DokkaPlugin'))
    p.pluginManager.apply(new GroovyClassLoader(loader).parseClass(markdownPluginSource))
    // KGP's 'main' and AGP's 'release' both get src/main, which Dokka rejects ("have the common source roots")
    p.extensions.getByName('dokka').dokkaSourceSets.matching { it.name == 'release' }.configureEach { it.suppress.set(true) }
    // Dokka's Markdown links inherited members (an enum entry's name and ordinal) to anchors it doesn't write
    p.extensions.getByName('dokka').dokkaPublications.configureEach { it.suppressInheritedMembers.set(true) }
    p.tasks.matching { it.name.startsWith('dokkaGenerate') }.configureEach {
      // Dokka doesn't depend on codegen, so without preBuild the generated spec supertype is an unresolved ERROR CLASS
      it.dependsOn(p.tasks.matching { it.name == 'preBuild' })
      // Dokka's inputs miss sources that appear later (RN codegen output), so it would keep a stale result
      it.outputs.upToDateWhen { false }
    }
  }
}

gradle.projectsEvaluated {
  if (!matched) throw new GradleException("No project in this Gradle build has the directory $targetDir")
}
