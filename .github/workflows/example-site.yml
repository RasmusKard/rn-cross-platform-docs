# Publishes examples/expo-greeter's site to this repo's GitHub Pages, as the example of what the tools produce.
name: Example site

on:
  push:
    branches: [main]
  schedule:
    # weekly, so an Xcode, Dokka or Zensical change that breaks the tools shows up between pushes
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: ./.github/workflows/deploy-zensical.yml
    with:
      working-directory: examples/expo-greeter
      # the default install looks for a lockfile in working-directory, and the workspace keeps it at the repo root
      install: corepack enable && pnpm install --frozen-lockfile
      prepare: cd example && pnpm exec expo prebuild
