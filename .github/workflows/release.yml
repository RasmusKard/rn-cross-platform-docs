name: Release

# Merging release-please's PR creates a draft release, attests a tarball per package, publishes them to npm with trusted
# publishing, un-drafts the release and moves its major tag.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Holds the App key; limited to main.
    environment: release
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with GITHUB_TOKEN would not trigger CI on the release PR.
      - id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # release-please releases main's head, which can be newer than the commit that triggered this run
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          # A cache written by other workflows could poison the release.
          package-manager-cache: false
      - run: |
          for p in . plugins/zensical; do
            test "v$(node -p "require('./$p/package.json').version")" = "$TAG"
          done
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
      - run: |
          pnpm install --frozen-lockfile --ignore-scripts
          for p in . plugins/zensical; do
            (cd "$p" && pnpm run lint && pnpm test && pnpm run build)
          done
      - run: npm pack --ignore-scripts . ./plugins/zensical
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: rn-cross-platform-docs-*.tgz

  # Holds the OIDC token, so it runs no repository or dependency code.
  attest:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
      - uses: actions/attest@v4.2.2
        with:
          subject-path: rn-cross-platform-docs-*.tgz
      - run: gh release upload "$TAG" rn-cross-platform-docs-*.tgz -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}

  # Holds the npm OIDC token, so it runs no repository or dependency code.
  publish:
    needs: [release-please, attest]
    runs-on: ubuntu-latest
    # npm's trusted publisher entries name this environment.
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
      # A tarball runs no lifecycle scripts.
      # shortcut: a re-run fails on a package that is already published, skip those once a release stops halfway
      - run: |
          for tarball in rn-cross-platform-docs-*.tgz; do
            npm publish "$tarball"
          done
      # The README's workflow examples pin the major tag (v1, ...).
      - run: |
          gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          major=${TAG%%.*}
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$sha" -F force=true >/dev/null 2>&1 ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$sha" >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
